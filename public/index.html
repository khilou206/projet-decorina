<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="theme-color"
    content="#171717"
  />

  <meta
    name="description"
    content="Coloring World — Transformez vos photos et souvenirs en tableaux Paint by Numbers uniques. Choisissez votre format et créez votre propre œuvre."
  />

  <meta
    name="keywords"
    content="Coloring World, Paint by Numbers, tableau personnalisé, peinture par numéros, tableau photo, décoration murale, Maroc"
  />

  <meta
    name="author"
    content="Coloring World"
  />


  <!-- Open Graph -->

  <meta
    property="og:title"
    content="Coloring World — Votre photo devient une œuvre"
  />

  <meta
    property="og:description"
    content="Transformez votre photo préférée en tableau Paint by Numbers personnalisé."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:image"
    content="%PUBLIC_URL%/images/og-image.jpg"
  />


  <!-- Twitter / Social -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Coloring World"
  />

  <meta
    name="twitter:description"
    content="Transformez vos souvenirs en art."
  />

  <meta
    name="twitter:image"
    content="%PUBLIC_URL%/images/og-image.jpg"
  />


  <!-- Favicon -->

  <link
    rel="icon"
    href="%PUBLIC_URL%/favicon.png"
  />


  <!-- Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"

  />

  <title>
    Coloring World — Transformez vos souvenirs en art
  </title>
